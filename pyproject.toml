[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mewcode"
version = "0.1.0"
description = "终端 AI 编程助手（类似 Claude Code）"
requires-python = ">=3.10"
dependencies = [
    "prompt_toolkit>=3.0",
    "rich>=13",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mewcode = "mewcode.cli:main"

[tool.setuptools.packages.find]
include = ["mewcode*"]

[tool.setuptools.package-data]
# ch13：内置样板技能随包分发（commit.md、review.md、test/ 目录）
mewcode = ["skills/**/*.md"]
