# MewCode 配置文件示例
# 复制为 ~/.mewcode/config.yaml 并填入你自己的密钥；
# 或放到任意位置后用 --config 指定路径。
#
# 每份配置包含 6 个字段：
#   name     供应商标识名（--profile 用它选择）
#   protocol 协议: anthropic | openai
#   model    模型名
#   base_url 请求地址（API 基础地址）
#   api_key  认证密钥
#   thinking 是否启用扩展思考（可选，缺省 false）
#
# 顶层可选字段：
#   custom_instructions 自定义指令（多行文本，可选）——拼进系统提示的
#   「自定义指令」模块，适合写全局偏好（回答语言、代码风格等）
#   mcp_servers MCP Server 声明（可选）——map：Server 名 → 传输配置；
#       stdio 给 command/args/env，http 给 url/headers，值支持 ${VAR} 展开；
#       用户级与项目级（.mewcode/config.yaml）按键合并，同名整条目覆盖

# custom_instructions: |
#   回答用中文
#   代码风格简洁

# mcp_servers:
#   demo:                          # stdio：本地子进程
#     command: python
#     args: [scripts/mock_mcp_server.py]
#   context7:                      # http：官方文档查询（API key 可到 context7.com 获取）
#     url: https://mcp.context7.com/mcp
#     headers:
#       Authorization: "Bearer ${CONTEXT7_TOKEN}"

providers:
  - name: claude
    protocol: anthropic
    model: claude-sonnet-4-5
    base_url: https://api.anthropic.com
    api_key: sk-ant-xxxx      # 到 console.anthropic.com 获取
    thinking: true            # 启用 extended thinking

  - name: gpt
    protocol: openai
    model: gpt-4o
    base_url: https://api.openai.com
    api_key: sk-xxxx          # 到 platform.openai.com 获取
    # thinking: true          # 可选：透传给支持 thinking 的 OpenAI 兼容服务
