services:
  mewcode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: "${MEWCODE_UID:-1000}"
        APP_GID: "${MEWCODE_GID:-1000}"

    image: mewcode:local

    stdin_open: true
    tty: true
    init: true

    working_dir: /workspace

    environment:
      HOME: /home/mewcode
      TERM: xterm-256color

    volumes:
      - type: bind
        source: ./runtime/user
        target: /home/mewcode/.mewcode

      - type: bind
        source: ./runtime/workspace
        target: /workspace

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
